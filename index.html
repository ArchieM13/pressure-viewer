<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedure Data</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f7fb;
    color: #1a1f2b;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    padding: 14px 16px;
    background: white;
    border: 1px solid #c5d3e3;
    border-radius: 10px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.logo {
    height: 52px;
    width: auto;
    display: block;
    object-fit: contain;
}

.header-text { min-width: 0; }

.urn {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #4a5568;
    margin-bottom: 4px;
}

h1 {
    font-size: 22px;
    margin-bottom: 4px;
    color: #000000;
}

.subtitle {
    color: #4a5568;
    font-size: 14px;
}

.download-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
}

.download-btn {
    appearance: none;
    border: 1px solid #1a1f2b;
    background: #1a1f2b;
    color: white;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.download-btn:hover {
    background: #2b3344;
    border-color: #2b3344;
}

.card {
    background: white;
    border: 1px solid #c5d3e3;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}

.card-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8696aa;
    margin-bottom: 8px;
}

.summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

.stat {
    background: white;
    border: 1px solid #c5d3e3;
    border-top: 3px solid #74E0AF;
    border-radius: 6px;
    padding: 12px;
}

.stat-label {
    font-size: 11px;
    text-transform: uppercase;
    color: #8696aa;
    letter-spacing: 0.5px;
}

.stat-value {
    font-size: 24px;
    font-weight: 600;
    color: #1a1f2b;
    margin-top: 4px;
}

canvas#graph {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid #dde6f0;
    border-radius: 4px;
    background: #fafcff;
}

.legend {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    font-size: 12px;
    color: #4a5568;
}

.legend-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
}

.dot-alert { background: #cc0000; }

.events { list-style: none; }

.event {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #dde6f0;
}

.event:last-child { border-bottom: none; }

.event-label { font-weight: 500; }

.event-pressure {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: #1a1f2b;
    font-weight: 600;
}

.event-time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: #4a5568;
    min-width: 60px;
    text-align: right;
}

.event-alert .event-label { color: #cc0000; }
.event-dismiss .event-label { color: #4a5568; }

.error {
    background: #fee;
    border: 1px solid #fcc;
    color: #900;
    padding: 16px;
    border-radius: 6px;
}

.no-events {
    color: #8696aa;
    font-style: italic;
    padding: 8px 0;
}

/* ── Multi-scan gate UI ─────────────────────────────────── */
.scan-gate {
    background: white;
    border: 1px solid #c5d3e3;
    border-radius: 10px;
    padding: 24px 20px;
    text-align: center;
}

.scan-progress {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
}

.pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #c5d3e3;
    color: #8696aa;
    background: #f4f7fb;
}

.pill.done {
    color: #0a7d4d;
    border-color: #74E0AF;
    background: #effaf3;
}

.pill .tick {
    display: inline-flex;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #74E0AF;
    color: white;
    align-items: center;
    justify-content: center;
    font-size: 11px;
}

.scan-gate h2 {
    font-size: 18px;
    margin-bottom: 6px;
    color: #1a1f2b;
}

.scan-gate p {
    color: #4a5568;
    font-size: 14px;
    margin-bottom: 18px;
    line-height: 1.5;
}

.scan-btn {
    appearance: none;
    border: none;
    background: #0055b8;
    color: white;
    border-radius: 8px;
    padding: 14px 22px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.scan-btn:hover { background: #003d82; }

.scan-btn:disabled {
    background: #c5d3e3;
    cursor: default;
}

#reader {
    width: 100%;
    max-width: 360px;
    margin: 0 auto 16px;
    border-radius: 8px;
    overflow: hidden;
}

.scan-hint {
    font-size: 12px;
    color: #8696aa;
    margin-top: 4px;
}

.scan-cancel {
    appearance: none;
    border: 1px solid #c5d3e3;
    background: white;
    color: #4a5568;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}

@media (max-width: 600px) {
    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .header-left {
        align-items: flex-start;
        flex-direction: column;
    }

    .logo { height: 44px; }

    .summary {
        grid-template-columns: 1fr;
    }

    .download-row {
        justify-content: stretch;
    }

    .download-btn {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="OrthoSonLogo.jpg" alt="OrthoSon logo" class="logo">
        <div class="header-text">
            <div class="urn">URN: 0001</div>
            <h1>Pressure Monitor Procedure Report</h1>
            <div class="subtitle">Decoded from device QR code</div>
        </div>
    </div>
</div>

<div id="content"></div>

<!-- QR scanning library for the in-page second-code scan -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const PRESSURE_MAX = 25.0;
const SAMPLE_INTERVAL_S = 1.0;
const EXPORTED_SAMPLE_RATE_HZ = 1;

const EVENT_TYPES = {
    1: { name: "NEEDLE ERROR", class: "event-alert", isAlert: true },
    2: { name: "LOW PRESSURE", class: "event-alert", isAlert: true },
    3: { name: "HIGH PRESSURE", class: "event-alert", isAlert: true },
    4: { name: "Alert Dismissed", class: "event-dismiss", isAlert: false }
};

const HIDDEN_EVENT_TYPES = new Set([]);

// ── Multi-scan session state ────────────────────────────────
// Each QR carries: sid (session id), part (1..total), total, and data.
// For the demo, every part carries the FULL dataset, so any part can
// render the report — but we still require all parts to be *seen*
// before unlocking, to exercise the real multi-scan flow.
const scanSession = {
    sid: null,
    total: 1,
    partsSeen: new Set(),
    fullData: null   // {samples, events} from any complete part
};

let qrScanner = null;

function decodeBase64URL(str) {
    const b64chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
    const out = [];
    let i = 0;

    while (i < str.length) {
        const c1 = b64chars.indexOf(str[i++]);
        const c2 = b64chars.indexOf(str[i++]);
        const c3 = i < str.length ? b64chars.indexOf(str[i++]) : -1;
        const c4 = i < str.length ? b64chars.indexOf(str[i++]) : -1;

        if (c1 < 0 || c2 < 0) break;

        const v = (c1 << 18) | (c2 << 12) | ((c3 < 0 ? 0 : c3) << 6) | (c4 < 0 ? 0 : c4);
        out.push((v >> 16) & 0xFF);
        if (str[i - 2] !== '_') out.push((v >> 8) & 0xFF);
        if (str[i - 1] !== '_') out.push(v & 0xFF);
    }

    return out;
}

function parseBlob(bytes) {
    let idx = 0;
    const version = bytes[idx++];

    if (version !== 0x01) {
        throw new Error("Unsupported data version: " + version);
    }

    const sampleCount = (bytes[idx++] << 8) | bytes[idx++];
    const samples = [];

    for (let i = 0; i < sampleCount; i++) {
        const b = bytes[idx++];
        samples.push((b / 255) * PRESSURE_MAX);
    }

    const eventCount = bytes[idx++];
    const events = [];

    for (let i = 0; i < eventCount; i++) {
        const type = bytes[idx++];
        const ts = (bytes[idx++] << 8) | bytes[idx++];
        events.push({ type, timestampS: ts });
    }

    return { samples, events };
}

// Parse a scanned/loaded fragment string into its fields.
// Expected fragment format:  sid=<id>&part=<n>&total=<n>&d=<base64data>
// Falls back to treating the whole thing as raw data (single-part, legacy).
function parseFragment(frag) {
    if (!frag) return null;

    // Legacy / single-code form: the whole hash is just base64 data.
    if (frag.indexOf("=") === -1 || frag.indexOf("d=") === -1) {
        return { sid: "legacy", part: 1, total: 1, data: frag };
    }

    const params = {};
    frag.split("&").forEach(kv => {
        const eq = kv.indexOf("=");
        if (eq > 0) params[kv.slice(0, eq)] = kv.slice(eq + 1);
    });

    return {
        sid: params.sid || "nosid",
        part: parseInt(params.part || "1", 10),
        total: parseInt(params.total || "1", 10),
        data: params.d || ""
    };
}

// Extract the URL fragment from a full URL or a bare fragment string.
function fragmentFromText(text) {
    const hashIdx = text.indexOf("#");
    if (hashIdx >= 0) return text.slice(hashIdx + 1);
    return text;  // assume it's already a bare fragment
}

// Ingest one fragment. Returns true if it was accepted.
function ingestFragment(frag) {
    const f = parseFragment(frag);
    if (!f) return false;

    // New session? reset.
    if (scanSession.sid !== f.sid) {
        scanSession.sid = f.sid;
        scanSession.total = f.total || 1;
        scanSession.partsSeen = new Set();
        scanSession.fullData = null;
    }

    scanSession.total = f.total || scanSession.total;
    scanSession.partsSeen.add(f.part);

    // For the demo each part holds the full dataset; decode if we can.
    if (!scanSession.fullData && f.data) {
        try {
            const bytes = decodeBase64URL(f.data);
            scanSession.fullData = parseBlob(bytes);
        } catch (e) {
            // ignore decode errors on an individual part
        }
    }

    return true;
}

function allPartsSeen() {
    if (scanSession.partsSeen.size < scanSession.total) return false;
    for (let p = 1; p <= scanSession.total; p++) {
        if (!scanSession.partsSeen.has(p)) return false;
    }
    return true;
}

function pressureAtTime(samples, timeS) {
    if (samples.length === 0) return 0;

    const idx = timeS / SAMPLE_INTERVAL_S;
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, samples.length - 1);

    if (i0 < 0) return samples[0];
    if (i0 >= samples.length) return samples[samples.length - 1];

    const t = idx - i0;
    return samples[i0] * (1 - t) + samples[i1] * t;
}

function buildCSV(samples, events) {
    const rows = [
        ["Patient Procedure Data Log"],
        ["URN: 0001"],
        ["Sample rate: 1 Hz QR-exported data"],
        [],
        ["time_s", "pressure", "alert_active", "alert_type"]
    ];

    let activeAlertType = null;
    let eventIndex = 0;
    const sortedEvents = [...events].sort((a, b) => a.timestampS - b.timestampS);

    for (let i = 0; i < samples.length; i++) {
        const timeS = i;

        while (eventIndex < sortedEvents.length && sortedEvents[eventIndex].timestampS <= timeS) {
            const ev = sortedEvents[eventIndex];
            if (ev.type === 1 || ev.type === 2 || ev.type === 3) activeAlertType = ev.type;
            if (ev.type === 4) activeAlertType = null;
            eventIndex++;
        }

        let alertActive = "no";
        let alertLabel = "";

        if (activeAlertType === 1) {
            alertActive = "yes";
            alertLabel = "NEEDLE ERROR";
        } else if (activeAlertType === 2 && samples[i] < 4.0) {
            alertActive = "yes";
            alertLabel = "LOW PRESSURE";
        } else if (activeAlertType === 3 && samples[i] > 20.0) {
            alertActive = "yes";
            alertLabel = "HIGH PRESSURE";
        }

        rows.push([
            String(timeS),
            samples[i].toFixed(1),
            alertActive,
            alertLabel
        ]);
    }

    return rows
        .map(row => row.map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","))
        .join("\n");
}

function downloadCSV(samples, events) {
    const csv = buildCSV(samples, events);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "patient_procedure_data_log.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
}

function drawGraph(canvas, samples, events) {
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth;
    const cssH = 320;

    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.height = cssH + "px";
    ctx.scale(dpr, dpr);

    const padL = 40, padR = 16, padT = 16, padB = 28;
    const w = cssW - padL - padR;
    const h = cssH - padT - padB;

    ctx.fillStyle = "#fafcff";
    ctx.fillRect(0, 0, cssW, cssH);

    ctx.strokeStyle = "#dde6f0";
    ctx.fillStyle = "#8696aa";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    for (let i = 0; i <= 5; i++) {
        const v = (PRESSURE_MAX / 5) * i;
        const y = padT + h - (v / PRESSURE_MAX) * h;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL + w, y);
        ctx.stroke();
        ctx.fillText(v.toFixed(0), padL - 4, y);
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";

    const totalS = samples.length > 0 ? samples.length - 1 : 0;
    const stepS = totalS > 60 ? 30 : (totalS > 20 ? 10 : 5);

    for (let s = 0; s <= totalS; s += stepS) {
        const x = totalS > 0 ? padL + (s / totalS) * w : padL;
        ctx.fillText(s + "s", x, padT + h + 6);
    }

    if (samples.length > 1) {
        ctx.strokeStyle = "#74E0AF";
        ctx.lineWidth = 2;
        ctx.beginPath();

        for (let i = 0; i < samples.length; i++) {
            const x = padL + (i / (samples.length - 1)) * w;
            const y = padT + h - (samples[i] / PRESSURE_MAX) * h;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }

        ctx.stroke();
    }

    for (const ev of events) {
        if (HIDDEN_EVENT_TYPES.has(ev.type)) continue;

        const meta = EVENT_TYPES[ev.type];
        if (!meta || ev.type === 4) continue;

        const pressure = pressureAtTime(samples, ev.timestampS);
        const x = totalS > 0 ? padL + (ev.timestampS / totalS) * w : padL;
        const y = padT + h - (pressure / PRESSURE_MAX) * h;

        ctx.fillStyle = meta.isAlert ? "#cc0000" : "#000000";
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.strokeStyle = "#c5d3e3";
    ctx.lineWidth = 1;
    ctx.strokeRect(padL, padT, w, h);
}

function fmtTime(s) {
    const total = Math.round(s);
    const m = Math.floor(total / 60);
    const sec = total % 60;
    return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

// ── Render the gate (waiting for more parts) ────────────────
function renderGate() {
    const content = document.getElementById("content");
    const seen = scanSession.partsSeen.size;
    const total = scanSession.total;

    let pills = "";
    for (let p = 1; p <= total; p++) {
        const done = scanSession.partsSeen.has(p);
        pills += `<div class="pill ${done ? "done" : ""}">
            ${done ? '<span class="tick">&#10003;</span>' : ''}
            Code ${p}
        </div>`;
    }

    content.innerHTML = `
        <div class="scan-gate">
            <div class="scan-progress">${pills}</div>
            <h2>Scanned ${seen} of ${total}</h2>
            <p>Press the button on the device to show the next QR code,
               then scan it here to complete the procedure report.</p>
            <div id="reader"></div>
            <button class="scan-btn" id="startScanBtn">Scan next code</button>
            <div class="scan-hint" id="scanHint"></div>
        </div>
    `;

    document.getElementById("startScanBtn")
        .addEventListener("click", startInPageScan);
}

function stopScanner(cb) {
    if (qrScanner) {
        qrScanner.stop().then(() => {
            qrScanner.clear();
            qrScanner = null;
            if (cb) cb();
        }).catch(() => {
            qrScanner = null;
            if (cb) cb();
        });
    } else if (cb) {
        cb();
    }
}

function startInPageScan() {
    const btn = document.getElementById("startScanBtn");
    const hint = document.getElementById("scanHint");
    btn.disabled = true;
    btn.textContent = "Starting camera…";

    if (typeof Html5Qrcode === "undefined") {
        hint.textContent = "Scanner library failed to load. Check your connection and reload.";
        btn.disabled = false;
        btn.textContent = "Scan next code";
        return;
    }

    // Use the browser's native barcode detector when available (iOS 16.4+,
    // modern Chrome). This is hardware-accelerated and dramatically faster —
    // closer to what dedicated apps feel like — and we fall back to the
    // library's own decoder otherwise.
    const scannerConfig = { useBarCodeDetectorIfSupported: true };
    if (typeof Html5QrcodeSupportedFormats !== "undefined") {
        scannerConfig.formatsToSupport = [Html5QrcodeSupportedFormats.QR_CODE];
    }
    qrScanner = new Html5Qrcode("reader", scannerConfig);

    // Adaptive scan box: a large square based on the live viewport so the
    // user doesn't have to line the code up precisely. 70% of the smaller
    // dimension, capped so it stays sensible on big screens.
    const qrboxFn = (vw, vh) => {
        const min = Math.min(vw, vh);
        const size = Math.floor(min * 0.7);
        return { width: size, height: size };
    };

    const config = {
        fps: 25,                      // more decode attempts per second
        qrbox: qrboxFn,
        aspectRatio: 1.0,
        videoConstraints: {
            facingMode: { ideal: "environment" },
            width:  { ideal: 1920 },  // request a high-res stream: more pixels
            height: { ideal: 1080 },  // on the code = easier, faster decode
            // Continuous autofocus so the camera locks on without you
            // having to hunt for the exact distance.
            focusMode: "continuous",
            advanced: [{ focusMode: "continuous" }]
        }
    };

    qrScanner.start(
        config.videoConstraints,
        config,
        (decodedText) => {
            // Got a scan — ingest it.
            const frag = fragmentFromText(decodedText);
            const accepted = ingestFragment(frag);
            if (accepted) {
                stopScanner(() => {
                    if (allPartsSeen()) {
                        renderReport();
                    } else {
                        renderGate();
                    }
                });
            }
        },
        (errMsg) => { /* per-frame decode failures: ignore */ }
    ).then(() => {
        btn.style.display = "none";
        hint.textContent = "Point the camera at the next QR code — it'll scan automatically.";
    }).catch((err) => {
        // Fall back to a simpler constraint set if the high-res / focus
        // request was rejected by the browser.
        startInPageScanFallback(btn, hint, err);
    });
}

// Simpler, maximally-compatible fallback if the rich constraints fail.
function startInPageScanFallback(btn, hint, originalErr) {
    qrScanner = new Html5Qrcode("reader", {
        useBarCodeDetectorIfSupported: true
    });

    qrScanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 260, height: 260 } },
        (decodedText) => {
            const frag = fragmentFromText(decodedText);
            if (ingestFragment(frag)) {
                stopScanner(() => {
                    if (allPartsSeen()) renderReport();
                    else renderGate();
                });
            }
        },
        () => {}
    ).then(() => {
        btn.style.display = "none";
        hint.textContent = "Point the camera at the next QR code — it'll scan automatically.";
    }).catch((err) => {
        hint.textContent = "Could not start camera: " + err +
            ". Make sure camera permission is allowed for this site.";
        btn.disabled = false;
        btn.textContent = "Scan next code";
        qrScanner = null;
    });
}

// ── Render the full report ──────────────────────────────────
function renderReport() {
    const content = document.getElementById("content");
    const data = scanSession.fullData;

    if (!data) {
        content.innerHTML = '<div class="error">Data could not be decoded from the scanned codes.</div>';
        return;
    }

    const { samples, events } = data;
    const visibleEvents = events.filter(e => !HIDDEN_EVENT_TYPES.has(e.type));
    const durationS = samples.length > 0 ? samples.length - 1 : 0;
    const peak = samples.length ? Math.max(...samples).toFixed(1) : "—";

    let eventHTML;
    if (visibleEvents.length === 0) {
        eventHTML = '<div class="no-events">No events recorded during procedure.</div>';
    } else {
        eventHTML = '<ul class="events">' + visibleEvents.map(e => {
            const meta = EVENT_TYPES[e.type] || { name: "Unknown (" + e.type + ")", class: "" };
            const pressure = pressureAtTime(samples, e.timestampS).toFixed(1);
            return `<li class="event ${meta.class}">
                <span class="event-label">${meta.name}</span>
                <span class="event-pressure">${pressure}</span>
                <span class="event-time">${fmtTime(e.timestampS)}</span>
            </li>`;
        }).join("") + '</ul>';
    }

    content.innerHTML = `
        <div class="download-row">
            <button class="download-btn" id="downloadCsvBtn">Download pressure readings CSV</button>
        </div>

        <div class="summary">
            <div class="stat">
                <div class="stat-label">Duration</div>
                <div class="stat-value">${fmtTime(durationS)}</div>
            </div>
            <div class="stat">
                <div class="stat-label">Peak</div>
                <div class="stat-value">${peak}</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Pressure Trace</div>
            <canvas id="graph"></canvas>
            <div class="legend">
                <span><span class="legend-dot dot-alert"></span>Alert triggered</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Event Log (${visibleEvents.length})</div>
            ${eventHTML}
        </div>
    `;

    drawGraph(document.getElementById("graph"), samples, events);

    document.getElementById("downloadCsvBtn").addEventListener("click", () => {
        downloadCSV(samples, events);
    });
}

// ── Entry point ─────────────────────────────────────────────
function render() {
    const content = document.getElementById("content");
    const hash = window.location.hash.replace("#", "");

    if (!hash) {
        content.innerHTML = '<div class="error">No data found in URL. Scan the device QR code to begin.</div>';
        return;
    }

    const accepted = ingestFragment(hash);
    if (!accepted) {
        content.innerHTML = '<div class="error">Could not read the scanned code.</div>';
        return;
    }

    if (allPartsSeen()) {
        renderReport();
    } else {
        renderGate();
    }
}

render();

// If the page is reopened with a new hash (e.g. user scans part 2 with
// the native camera instead of the in-page scanner), handle it too.
window.addEventListener("hashchange", () => {
    const hash = window.location.hash.replace("#", "");
    if (!hash) return;
    ingestFragment(hash);
    if (allPartsSeen()) {
        renderReport();
    } else {
        renderGate();
    }
});
</script>

</body>
</html>
